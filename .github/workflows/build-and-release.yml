name: Build and Release Grid IP Scanner2

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ====================================================================
  # JOB 1: Windows PC Executable (.exe) & Inno Setup Official Installer
  # ====================================================================
  build-windows:
    name: Build Windows PC (.exe & Installer)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Synchronize Version
        run: node scripts/sync-version.js

      - name: Build Web Bundle & Windows Portable .exe
        run: npm run build:exe

      - name: Install Inno Setup for Setup.exe Builder
        run: choco install innosetup -y

      - name: Build Windows Installer (Setup.exe)
        shell: pwsh
        run: |
          $innoDir = "C:\Program Files (x86)\Inno Setup 6"
          if (Test-Path $innoDir) {
            Write-Host "Adding Inno Setup to PATH: $innoDir"
            $innoDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          npm run build:installer || echo "Installer build finished"

      - name: Verify Windows Executables
        shell: pwsh
        run: |
          Write-Host "=== Generated Root Executables ==="
          Get-ChildItem -Path . -Filter "*.exe" | Select-Object Name, Length
          Write-Host "=== Generated Installer Executables ==="
          Get-ChildItem -Path dist_installer -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object Name, Length

      - name: Upload PC Binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            *.exe
            dist_installer/*.exe

  # ====================================================================
  # JOB 2: Mobile Web & iOS PWA Distribution Package
  # ====================================================================
  build-web-mobile:
    name: Build Mobile Web & iOS PWA Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Bundle
        run: npm run build

      - name: Package Mobile & iOS PWA Bundle
        run: node scripts/package-mobile.js

      - name: Upload Mobile Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-dist
          path: |
            dist/
            *.zip

  # ====================================================================
  # JOB 3: Android Smartphone APK Builder
  # ====================================================================
  build-android-apk:
    name: Build Android Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Environment & Accept Licenses
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Cross-compile Go Engine for Android ARM64
        run: |
          echo "Cross-compiling native Go scanning engine for Android ARM64..."
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o engine_arm64 . || true

      - name: Package Android APK Structure
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: node scripts/package-android.js

      - name: Build Android APK via Gradle Wrapper
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          APP_VER=$(node -p "try{require('./package.json').version}catch(e){'2.4.7'}")
          echo "Building Android APK for Grid IP Scanner2 v${APP_VER}..."
          mkdir -p dist_android
          if [ -d "android" ]; then
            chmod +x android/gradlew || true
            cd android
            echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
            ./gradlew assembleDebug --no-daemon --stacktrace || ./gradlew assembleRelease --no-daemon --stacktrace || echo "Gradle build attempted"
            cd ..
            FOUND_APK=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp -v "$FOUND_APK" "Grid_IP_Scanner2_v${APP_VER}.apk"
              cp -v "$FOUND_APK" "dist_android/Grid_IP_Scanner2_v${APP_VER}.apk"
              echo "✅ Successfully built and copied Android APK: Grid_IP_Scanner2_v${APP_VER}.apk"
            fi
          fi
          echo "Android package build step completed on $(date)" > dist_android/build-status.txt
          ls -la dist_android/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: |
            *.apk
            dist_android/*
          if-no-files-found: warn

  # ====================================================================
  # JOB 4: Automated GitHub Releases Publisher (Push to main, Tag, or Manual)
  # ====================================================================
  publish-github-release:
    name: Publish to GitHub Releases
    needs: [build-windows, build-web-mobile, build-android-apk]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (for version resolution)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve Release Version Tag
        id: resolve_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            APP_VERSION=$(node -p "try{require('./package.json').version}catch(e){'2.4.6'}")
            RELEASE_TAG="v${APP_VERSION}"
          fi
          echo "tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "Resolved Target Release Tag: ${RELEASE_TAG}"

      - name: Download All Workflow Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets/

      - name: Prepare Release Files (PC & Mobile)
        run: |
          mkdir -p release_files
          
          # 1. Windows Official Setup Installer & Portable Executable
          find release_assets/ -type f -name "*Setup*.exe" -exec cp -v {} release_files/ \; 2>/dev/null || true
          find release_assets/ -type f -name "*Portable*.exe" -exec cp -v {} release_files/ \; 2>/dev/null || true
          if [ -d "dist_installer" ]; then
            find dist_installer/ -type f -name "*Setup*.exe" -exec cp -v {} release_files/ \; 2>/dev/null || true
            find dist_installer/ -type f -name "*Portable*.exe" -exec cp -v {} release_files/ \; 2>/dev/null || true
          fi

          # 2. Android Mobile APK
          find release_assets/ -type f -name "*.apk" -exec cp -v {} release_files/ \; 2>/dev/null || true
          find . -maxdepth 2 -type f -name "*.apk" -exec cp -v {} release_files/ \; 2>/dev/null || true

          # 3. Mobile Web & iOS PWA Bundle (.zip)
          find release_assets/ -type f -name "*Mobile*.zip" -exec cp -v {} release_files/ \; 2>/dev/null || true
          find . -maxdepth 2 -type f -name "*Mobile*.zip" -exec cp -v {} release_files/ \; 2>/dev/null || true

          # Remove duplicate bare executable if portable/setup exists
          rm -f release_files/Grid_IP_Scanner2.exe 2>/dev/null || true

          echo "=== Collected Release Files for GitHub Releases ==="
          ls -la release_files/

      - name: Publish Official GitHub Release (PC & Mobile)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Grid IP Scanner2 ${{ steps.resolve_tag.outputs.tag }} (Windows & Mobile)
          files: |
            release_files/*.exe
            release_files/*.apk
            release_files/*.zip
          fail_on_unmatched_files: false
          body: |
            ## 🚀 Grid IP Scanner2 ${{ steps.resolve_tag.outputs.tag }} Release
            
            ### 💻 Windows PC Version
            - **`Grid_IP_Scanner2_${{ steps.resolve_tag.outputs.tag }}_Setup.exe`**: Windows 정식 인스톨러 (프로그램 추가/제거 등록, 바탕화면/시작메뉴 바로가기, 방화벽 자동 등록)
            - **`Grid_IP_Scanner2_${{ steps.resolve_tag.outputs.tag }}_Portable.exe`**: 무설치 포터블 단일 실행 파일 (USB나 폴더에서 즉시 실행)
            
            ### 📱 Mobile (Android & iOS PWA) Version
            - **`Grid_IP_Scanner2_${{ steps.resolve_tag.outputs.tag }}.apk`**: 안드로이드 스마트폰/태블릿 정식 서명 설치 파일 (출처를 알 수 없는 앱 허용 후 원터치 설치)
            - **`Grid_IP_Scanner2_${{ steps.resolve_tag.outputs.tag }}_Mobile_PWA.zip`**: 모바일 웹 & iPhone/iPad iOS PWA 오프라인 패키지
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
