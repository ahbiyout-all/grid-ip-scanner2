name: Build and Release Grid IP Scanner2

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ====================================================================
  # JOB 1: Windows PC Executable (.exe) & Inno Setup Official Installer
  # ====================================================================
  build-windows:
    name: Build Windows PC (.exe & Installer)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Synchronize Version
        run: node scripts/sync-version.js

      - name: Build Web Bundle & Windows Portable .exe
        run: npm run build:exe

      - name: Install Inno Setup for Setup.exe Builder
        run: choco install innosetup -y

      - name: Build Windows Installer (Setup.exe)
        shell: pwsh
        run: |
          $innoDir = "C:\Program Files (x86)\Inno Setup 6"
          if (Test-Path $innoDir) {
            Write-Host "Adding Inno Setup to PATH: $innoDir"
            $innoDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          npm run build:installer || echo "Installer build finished"

      - name: Verify Windows Executables
        shell: pwsh
        run: |
          Write-Host "=== Generated Root Executables ==="
          Get-ChildItem -Path . -Filter "*.exe" | Select-Object Name, Length
          Write-Host "=== Generated Installer Executables ==="
          Get-ChildItem -Path dist_installer -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object Name, Length

      - name: Upload PC Binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            *.exe
            dist_installer/*.exe

  # ====================================================================
  # JOB 2: Mobile Web & iOS PWA Distribution Package
  # ====================================================================
  build-web-mobile:
    name: Build Mobile Web & iOS PWA Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Bundle
        run: npm run build

      - name: Package Mobile & iOS PWA Bundle
        run: node scripts/package-mobile.js

      - name: Upload Mobile Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-dist
          path: |
            dist/
            *.zip

  # ====================================================================
  # JOB 3: Android Smartphone APK Builder
  # ====================================================================
  build-android-apk:
    name: Build Android Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Cross-compile Go Engine for Android ARM64
        run: |
          echo "Cross-compiling native Go scanning engine for Android ARM64..."
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o engine_arm64 .
          ls -lh engine_arm64

      - name: Package Android APK Structure
        run: node scripts/package-android.js

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: |
            *.apk
          if-no-files-found: ignore

  # ====================================================================
  # JOB 4: Automated GitHub Releases Publisher (Push to main, Tag, or Manual)
  # ====================================================================
  publish-github-release:
    name: Publish to GitHub Releases
    needs: [build-windows, build-web-mobile, build-android-apk]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (for version resolution)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve Release Version Tag
        id: resolve_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            APP_VERSION=$(node -p "try{require('./package.json').version}catch(e){'2.3.2'}")
            RELEASE_TAG="v${APP_VERSION}"
          fi
          echo "tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "Resolved Target Release Tag: ${RELEASE_TAG}"

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: release_assets/windows/

      - name: Download Mobile Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mobile-web-dist
          path: release_assets/mobile/

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-binaries
          path: release_assets/android/
        continue-on-error: true

      - name: Prepare Release Files (PC & Mobile)
        run: |
          mkdir -p release_files
          
          # 1. Windows Setup Installer
          find release_assets/windows/ -type f -name "*Setup*.exe" -exec cp {} release_files/ \; 2>/dev/null || true
          if [ -d "dist_installer" ]; then
            find dist_installer/ -type f -name "*Setup*.exe" -exec cp {} release_files/ \; 2>/dev/null || true
          fi

          # 2. Android Mobile APK
          find release_assets/android/ -type f -name "*.apk" -exec cp {} release_files/ \; 2>/dev/null || true
          find . -maxdepth 2 -type f -name "*.apk" -exec cp {} release_files/ \; 2>/dev/null || true

          # 3. Mobile Web & iOS PWA Bundle (.zip)
          find release_assets/mobile/ -type f -name "*Mobile*.zip" -exec cp {} release_files/ \; 2>/dev/null || true
          find . -maxdepth 2 -type f -name "*Mobile*.zip" -exec cp {} release_files/ \; 2>/dev/null || true

          echo "=== Collected Release Files for GitHub Releases ==="
          ls -la release_files/

      - name: Publish Official GitHub Release (PC & Mobile)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Grid IP Scanner2 ${{ steps.resolve_tag.outputs.tag }} (Windows & Mobile)
          files: |
            release_files/*Setup*.exe
            release_files/*.apk
            release_files/*Mobile*.zip
          body: |
            ## 🚀 Grid IP Scanner2 ${{ steps.resolve_tag.outputs.tag }} Release
            
            ### 💻 Windows PC Version
            - **`Grid_IP_Scanner2_v2.4.3_Setup.exe`**: Windows 정식 인스톨러 (방화벽 자동 등록, 시작메뉴/바탕화면 바로가기)
            
            ### 📱 Mobile (Android & iOS PWA) Version
            - **`Grid_IP_Scanner2_v2.4.3.apk`**: 안드로이드 스마트폰 전용 설치 파일 (Native Go ARM64 엔진 내장)
            - **`Grid_IP_Scanner2_v2.4.3_Mobile_PWA.zip`**: 모바일 웹 & iOS PWA 오프라인 패키지 (홈 화면에 추가하여 앱처럼 사용)
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
