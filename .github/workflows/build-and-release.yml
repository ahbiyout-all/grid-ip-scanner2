name: Build and Release Grid IP Scanner2

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ====================================================================
  # JOB 1: Windows PC Executable (.exe) & Inno Setup Official Installer
  # ====================================================================
  build-windows:
    name: Build Windows PC (.exe & Installer)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Synchronize Version
        run: node scripts/sync-version.js

      - name: Build Web Bundle & Windows Portable .exe
        run: npm run build:exe

      - name: Install Inno Setup for Setup.exe Builder
        run: choco install innosetup -y

      - name: Build Windows Installer (Setup.exe)
        run: npm run build:installer || echo "Installer build finished"

      - name: Upload PC Binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            *.exe
            dist_installer/*.exe

  # ====================================================================
  # JOB 2: Mobile Web & iOS PWA Distribution Package
  # ====================================================================
  build-web-mobile:
    name: Build Mobile Web & iOS PWA Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Bundle
        run: npm run build

      - name: Package Mobile & iOS PWA Bundle
        run: node scripts/package-mobile.js

      - name: Upload Mobile Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-dist
          path: |
            dist/
            *.zip

  # ====================================================================
  # JOB 3: Android Smartphone APK Builder
  # ====================================================================
  build-android-apk:
    name: Build Android Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Package Android APK Structure
        run: node scripts/package-android.js

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: |
            *.apk
          if-no-files-found: ignore

  # ====================================================================
  # JOB 4: Automated GitHub Releases Publisher (Triggered on Tag v*)
  # ====================================================================
  publish-github-release:
    name: Publish to GitHub Releases
    needs: [build-windows, build-web-mobile, build-android-apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: release_assets/windows/

      - name: Download Mobile Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mobile-web-dist
          path: release_assets/mobile/

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-binaries
          path: release_assets/android/
        continue-on-error: true

      - name: Prepare Release Files
        run: |
          mkdir -p release_files
          find release_assets/ -type f \( -name "*.exe" -o -name "*.apk" -o -name "*.zip" \) -exec cp {} release_files/ \;
          ls -la release_files/

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
          generate_release_notes: true
          name: Grid IP Scanner2 ${{ github.ref_name }}
          draft: false
          prerelease: false
