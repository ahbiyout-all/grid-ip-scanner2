// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// Explicitly ensure no deprecated '--parallel' CLI arguments or parallel worker lease locks interfere with build tasks
gradle.startParameter.parallelProjectExecutionEnabled = false
gradle.startParameter.maxWorkerCount = 2

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy {
            force "androidx.core:core:$androidxCoreVersion"
            force "androidx.core:core-ktx:$androidxCoreVersion"
            force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
            force "org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22"
        }
    }
    tasks.whenTaskAdded { task ->
        if (task.name.toLowerCase().contains("aarmetadata")) {
            task.enabled = false
        }
    }
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}
